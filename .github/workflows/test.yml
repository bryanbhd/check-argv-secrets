name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: install semgrep
        run: pipx install semgrep
      - name: fixtures (bash script + semgrep rules)
        run: tests/run.sh --semgrep
      - name: the repo checks itself
        run: bash check-argv-secrets.sh --exclude '^tests/fixtures/' --exclude '^README\.md$'
