# Semgrep rules: secrets passed on a command line (CWE-214).
# Same checks as check-argv-secrets.sh, for teams that already run semgrep:
#   semgrep scan --config rules/argv-secrets.yaml .
# Regex rules in "generic" mode, so they work on shell scripts, Makefiles, Dockerfiles and
# CI YAML alike. Comment lines and CI env/with mapping lines are excluded.
rules:
  - id: argv-secret-curl-header
    message: >-
      A credential header is passed to curl as a command-line argument, where any user can read it
      (ps, /proc/<pid>/cmdline). Pass headers through a config file instead:
      curl -K <(printf 'header = "Authorization: Bearer %s"\n' "$TOKEN")
    severity: ERROR
    languages: [generic]
    paths: &paths
      include: ["*.sh", "*.bash", "*.zsh", "*.yml", "*.yaml", "*.ps1", "*.mk", "Makefile", "Dockerfile", "Jenkinsfile"]
    metadata: &meta
      cwe: "CWE-214: Invocation of Process Using Visible Sensitive Information"
      category: security
      references:
        - https://cwe.mitre.org/data/definitions/214.html
        - https://github.com/bryanbhd/check-argv-secrets#safe-forms
    patterns:
      - pattern-regex: '(-H|--header)\s+["''](X-Vault-Token|Authorization|X-Api-Key|X-Auth-Token|PRIVATE-TOKEN|Api-Key|Cookie):[^"''\n]*\$'
      - pattern-not-regex: &comment '(?m)^[ \t]*(#|//).*$'
      - pattern-not-regex: &envmap '(?m)^[ \t]*-?[ \t]*(?!(run|bash|script|sh|pwsh|powershell|inlineScript)[ \t]*:)[A-Za-z_][A-Za-z0-9_-]*:[ \t]+["'']?(\$\(|\$\{\{).*$'

  - id: argv-secret-curl-body
    message: >-
      A secret is put into a request body on the command line. Send the body on stdin or through a
      process substitution instead: --data @<(printf '{"secret_id":"%s"}' "$SID") or --data @-
    severity: ERROR
    languages: [generic]
    paths: *paths
    metadata: *meta
    patterns:
      - pattern-regex: '(-d|--data|--data-raw|--data-binary|--data-urlencode)\s+["'']([^"''\\\n]|\\.)*(secret_id|secret|password|passwd|_token|token|api_key|apikey)([^"''\\\n]|\\.)*\$'
      - pattern-not-regex: *comment
      - pattern-not-regex: *envmap

  - id: argv-secret-subshell
    message: >-
      A secret variable is expanded inside the quoted command string of bash -c / sh -c (often via ssh or incus exec),
      so it ends up in that process's arguments. Pass it through the environment or stdin instead.
    severity: ERROR
    languages: [generic]
    paths: *paths
    metadata: *meta
    patterns:
      - pattern-regex: '\b(bash|sh|zsh)\s+-c\s+["''][^"''\n]*\$\{?[A-Za-z_]*(SECRET|PASSWORD|PASSWD|TOKEN|API_?KEY|PRIVATE_?KEY|CREDENTIAL)'
      - pattern-not-regex: *comment
      - pattern-not-regex: *envmap

  - id: argv-secret-password-flag
    message: >-
      A password is passed as a command-line flag. Use the tool's environment variable or config
      file instead: SSHPASS + sshpass -e, MYSQL_PWD or --defaults-extra-file for mysql/mariadb.
    severity: ERROR
    languages: [generic]
    paths: *paths
    metadata: *meta
    patterns:
      - pattern-regex: '(sshpass[^|;&\n]*\s-p\s?|(mysql|mariadb|mysqldump|mariadb-dump|mysqladmin)[^|;&\n]*\s(-p|--password=))["'']?\$'
      - pattern-not-regex: *comment
      - pattern-not-regex: *envmap

  - id: argv-secret-ado-macro
    message: >-
      An Azure DevOps secret variable is pasted into script text with the $(NAME) macro, so its value
      lands in the generated script and any command it is used in. Map it under the step's env: and
      use "$NAME" in the script.
    severity: ERROR
    languages: [generic]
    paths: *paths
    metadata: *meta
    patterns:
      - pattern-regex: '\$\((VAULT_SECRET_ID[A-Z_]*|[A-Z_]*(PASSWORD|SECRET|SECRET_ID|API_KEY|TOKEN)[A-Z_]*)\)'
      - pattern-not-regex: *comment
      - pattern-not-regex: *envmap

  - id: argv-secret-gha-secret
    message: >-
      A GitHub Actions secret expression is used inside a run script, so its value is substituted into
      the script text (and any command line built from it). Map it under env: and use "$NAME" instead.
    severity: ERROR
    languages: [generic]
    paths: *paths
    metadata: *meta
    patterns:
      - pattern-regex: '\$\{\{\s*secrets\.[A-Za-z0-9_]+\s*\}\}'
      - pattern-not-regex: *comment
      - pattern-not-regex: *envmap
